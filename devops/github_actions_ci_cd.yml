name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================================================
  # CODE QUALITY & LINTING
  # ========================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy
      
      - name: Check formatting with Black
        run: black --check backend/ ml/ engine/ --diff
      
      - name: Check import sorting with isort
        run: isort --check-only backend/ ml/ engine/
      
      - name: Lint with flake8
        run: |
          flake8 backend/ ml/ engine/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ ml/ engine/ --count --exit-zero --max-complexity=10 --max-line-length=120
      
      - name: Type check with mypy
        continue-on-error: true
        run: mypy backend/ ml/ --ignore-missing-imports

  # ========================================================================
  # UNIT TESTS
  # ========================================================================
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patienttriage_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_round2.txt
      
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patienttriage_test
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: testing
        run: |
          pytest tests/ -v --cov=backend --cov=engine --cov=ml \
            --cov-report=xml --cov-report=html --cov-report=term-missing
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # ========================================================================
  # INTEGRATION TESTS
  # ========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patienttriage_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_round2.txt
      
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patienttriage_test
          ENVIRONMENT: testing
        run: |
          pytest tests/test_integration_advanced.py -v --tb=short
      
      - name: Test database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patienttriage_test
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  # ========================================================================
  # SECURITY SCANNING
  # ========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: bandit -r backend/ ml/ engine/ -f json -o bandit-report.json || true
      
      - name: Check for known vulnerabilities
        run: safety check --json || true

  # ========================================================================
  # BUILD & PUSH DOCKER IMAGES
  # ========================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [quality, tests, integration, security]
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================================
  # DEPLOYMENT (Production only)
  # ========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to production Kubernetes cluster..."
          # Configure kubectl
          # kubectl apply -f k8s/prod/
          # kubectl rollout status deployment/patienttriage-api -n production
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "PatientTriage.ai deployment: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "PatientTriage.ai Production Deployment\nStatus: ${{ job.status }}"
                  }
                }
              ]
            }

  # ========================================================================
  # MODEL TRAINING & VALIDATION (Optional)
  # ========================================================================
  model-training:
    name: Model Training & Validation
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[train-model]') || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_round2.txt
      
      - name: Train model
        run: python ml/training/train.py
      
      - name: Validate model
        run: python ml/training/validate.py
      
      - name: Upload model artifacts
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: models/checkpoints/

# ============================================================================
# WORKFLOW SUMMARY
# ============================================================================

# This CI/CD pipeline:
#
# 1. Quality: Runs Black, isort, flake8, mypy for code quality
# 2. Tests: Runs unit tests with coverage reporting
# 3. Integration: Runs integration tests with database
# 4. Security: Runs Bandit and safety checks
# 5. Build: Builds and pushes Docker images to registry
# 6. Deploy: (Production only) Deploys to Kubernetes
# 7. Training: (Optional) Trains and validates ML models
#
# Triggers:
# - On push to main/develop
# - On pull requests to main/develop
# - On workflow_dispatch (manual trigger)
#
# Secrets required:
# - SLACK_WEBHOOK_URL (for notifications)
# - GITHUB_TOKEN (auto-provided)
